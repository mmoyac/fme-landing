# Configuracion de desarrollo con Nginx
# Para probar localmente antes de produccion

services:
  # PostgreSQL Database
  db:
    image: postgres:14-alpine
    container_name: masas_estacion_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-fme}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fme}
      POSTGRES_DB: ${DB_NAME:-fme_database}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - dev-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fme}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build: 
      context: ../../fme-backend
      dockerfile: Dockerfile
    container_name: masas_estacion_backend_dev
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:-fme}:${DB_PASSWORD:-fme}@db:5432/${DB_NAME:-fme_database}
      PYTHONUNBUFFERED: 1
    volumes:
      - ../../fme-backend:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dev-net
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/docs')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Next.js Landing Page
  landing:
    build:
      context: ..
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: http://api.masasestacion.local
    container_name: masas_estacion_landing_dev
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://api.masasestacion.local
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - dev-net

  # Next.js Backoffice
  backoffice:
    build:
      context: ../../fme-backoffice
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: http://api.masasestacion.local
    container_name: masas_estacion_backoffice_dev
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://api.masasestacion.local
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - dev-net

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: masas_estacion_nginx_dev
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - backend
      - landing
      - backoffice
    networks:
      - dev-net
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  dev-net:
    driver: bridge

volumes:
  postgres_data_dev:
