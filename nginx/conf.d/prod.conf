# ============================================
# Producción - Configuración HTTPS con SSL
# DNS dinámico para evitar cacheo
# ============================================

# Resolver de Docker (127.0.0.11 es el DNS interno de Docker)
resolver 127.0.0.11 valid=10s ipv6=off;

# Redirect HTTP → HTTPS para API
server {
    listen 80;
    server_name api.masasestacion.cl;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Redirect HTTP → HTTPS para Landing
server {
    listen 80;
    server_name masasestacion.cl www.masasestacion.cl;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Redirect HTTP → HTTPS para Backoffice
server {
    listen 80;
    server_name admin.masasestacion.cl;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================
# HTTPS - API Backend
# ============================================
server {
    listen 443 ssl http2;
    server_name api.masasestacion.cl;

    # Certificados SSL
    ssl_certificate /etc/letsencrypt/live/api.masasestacion.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.masasestacion.cl/privkey.pem;
    
    # Configuración SSL moderna
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # HSTS (HTTP Strict Transport Security)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Límite de tasa para API
    limit_req zone=api_limit burst=20 nodelay;

    location / {
        # Variable para forzar resolución DNS dinámica
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts para API
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# ============================================
# HTTPS - Landing Page
# ============================================
server {
    listen 443 ssl http2;
    server_name masasestacion.cl www.masasestacion.cl;

    # Certificados SSL
    ssl_certificate /etc/letsencrypt/live/masasestacion.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/masasestacion.cl/privkey.pem;
    
    # Configuración SSL moderna
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Límite de tasa general
    limit_req zone=general_limit burst=50 nodelay;

    location / {
        # Variable para forzar resolución DNS dinámica
        set $landing_upstream landing:3000;
        proxy_pass http://$landing_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support (Next.js HMR en dev, no necesario en prod pero no hace daño)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Cache para assets estáticos
    location /_next/static/ {
        set $landing_upstream landing:3000;
        proxy_pass http://$landing_upstream;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, immutable";
    }
}

