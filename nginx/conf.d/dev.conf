# Configuración de desarrollo (HTTP sin SSL)
# Para probar localmente antes de producción

# API Backend
server {
    listen 80;
    server_name api.masasestacion.local;

    # Rate limiting para API
    limit_req zone=api_limit burst=20 nodelay;

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts para API
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

# Landing Page (Frontend público)
server {
    listen 80;
    server_name masasestacion.local www.masasestacion.local;

    # Rate limiting general
    limit_req zone=general_limit burst=50 nodelay;

    location / {
        proxy_pass http://landing:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support para Next.js hot reload
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Backoffice Admin Panel
server {
    listen 80;
    server_name admin.masasestacion.local;

    # Rate limiting general
    limit_req zone=general_limit burst=50 nodelay;

    location / {
        proxy_pass http://backoffice:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support para Next.js hot reload
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
