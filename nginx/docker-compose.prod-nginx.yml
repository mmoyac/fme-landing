version: '3.8'

services:
  # ============================================
  # PostgreSQL - Base de Datos (Existente)
  # ============================================
  db:
    image: postgres:14-alpine
    container_name: masas_estacion_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - prod-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Backend - FastAPI
  # ============================================
  backend:
    build:
      context: ../../fme-backend
      dockerfile: Dockerfile.prod
    image: mmoyac/masas-estacion-backend:latest
    container_name: masas_estacion_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      TZ: America/Santiago
    depends_on:
      db:
        condition: service_healthy
    networks:
      - prod-net
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/docs')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================
  # Landing - Next.js Frontend
  # ============================================
  landing:
    build:
      context: ..
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: https://api.masasestacion.cl
    image: mmoyac/masas-estacion-landing:latest
    container_name: masas_estacion_landing
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: https://api.masasestacion.cl
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - prod-net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================
  # Backoffice - Next.js Admin Panel
  # ============================================
  backoffice:
    build:
      context: ../../fme-backoffice
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: https://api.masasestacion.cl
    image: mmoyac/masas-estacion-backoffice:latest
    container_name: masas_estacion_backoffice
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: https://api.masasestacion.cl
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - prod-net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================
  # Nginx - Reverse Proxy con SSL
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: masas_estacion_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - landing
      - backoffice
    networks:
      - prod-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # Certbot - Renovación automática SSL
  # ============================================
  certbot:
    image: certbot/certbot
    container_name: masas_estacion_certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  prod-net:
    driver: bridge

volumes:
  postgres_data:
    # Volumen existente - NO se recreará
